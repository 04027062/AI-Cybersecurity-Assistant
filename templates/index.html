<!DOCTYPE html>
<html>

<head>
    <title>AI Cybersecurity Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>AI Cybersecurity Assistant</h1>

    <form method="POST">

        <textarea
            name="question"
            placeholder="Ask a cybersecurity question..."
            required>
        </textarea>

        <button type="submit">
            Ask AI
        </button>

    </form>

    {% if response %}

    <div class="response">

        <h2>AI Response:</h2>

        <p>{{ response }}</p>

    </div>

    {% endif %}

</div>

</body>

</html>
